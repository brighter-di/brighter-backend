name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          formatting=$(gofmt -l .)
          if [ -n "$formatting" ]; then
            echo "$formatting"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
